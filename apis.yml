name: CakeHealth
description: CakeHealth (Cake Health) was a San Francisco health-insurance management
  startup founded in 2011 by Rebecca Woodcock, pitched as "Mint for health insurance."
  Users linked their insurer logins so the service could aggregate health plans, claims,
  bills, deductibles, and out-of-pocket spending into a single consumer dashboard.
  It launched as a TechCrunch Disrupt finalist and was backed by 500 Startups (500
  Global) and Kima Ventures. Inbox Health acquired the company for its medical-bill
  tracking technology in April 2016, after which the product was shut down. The company
  is defunct and no longer operates an API or developer surface; the cakehealth.com
  domain has since been repurposed and now redirects to an unrelated third-party site.
